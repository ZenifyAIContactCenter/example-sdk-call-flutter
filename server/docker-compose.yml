# Chạy MỘT service: docker compose up -d --build push   (hoặc: … webhook)
# Cả hai cùng nguồn event → máy nhận push 2 lần (mỗi service chống trùng riêng).
# Cần trước: .env (chép .env.example) và key trong ./secrets/ — trong .env trỏ đường dẫn TRONG
# container: APN_KEY_FILE=/secrets/AuthKey_XXXXXXXXXX.p8, FCM_SERVICE_ACCOUNT_FILE=/secrets/xxx.json
services:
  # POST /push — webhook "Cuộc gọi App SDK" trên web Zenify trỏ tới đây (nên đặt WEBHOOK_AUTH_KEY)
  push:
    build: .
    image: zenify-push
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
    ports:
      # chỉ mở trên máy chủ; ra Internet thì đặt sau reverse proxy HTTPS
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  # Đọc event từ WEBHOOK_URL (webhook.site / bản tự host) rồi bắn push — không cần mở cổng
  webhook:
    build: .
    image: zenify-push
    command: ["node", "webhook.mjs"]
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
    restart: unless-stopped
