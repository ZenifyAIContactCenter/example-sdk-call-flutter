# docker compose up -d --build
# Cần trước: .env (chép .env.example) — WEBHOOK_TOKENS (uuid webhook) + key trong ./secrets/,
# trong .env trỏ đường dẫn TRONG container:
#   APN_KEY_FILE=/secrets/AuthKey_XXXXXXXXXX.p8, FCM_SERVICE_ACCOUNT_FILE=/secrets/xxx.json
services:
  # MỘT tiến trình: nhận webhook ở /<uuid> (web Zenify trỏ tới) → bắn push ngay; xem ở /view/<uuid>
  server:
    build: .
    image: zenify-push
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
    ports:
      # chỉ mở trên máy chủ; ra Internet (để server Zenify gọi tới) thì đặt sau reverse proxy HTTPS
      - "127.0.0.1:${SERVER_PORT:-3000}:3000"
    restart: unless-stopped
