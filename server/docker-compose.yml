# docker compose up -d --build
# Cần trước: .env (chép .env.example: APN_TEAM_ID, APN_BUNDLE_ID…) + thả 2 file key vào server/keys/
# (AuthKey_<KeyID>.p8, JSON service account Firebase) — lúc build được CHÉP vào container (/app/keys).
# Đổi key → chạy lại `docker compose up -d --build`.
# WEBHOOK_TOKENS để trống thì tự tạo uuid.
services:
  # MỘT tiến trình: nhận webhook ở /<uuid> (web Zenify trỏ tới) → bắn push ngay; xem ở /view/<uuid>
  server:
    build: .
    image: zenify-push
    env_file: .env
    volumes:
      # uuid webhook tự tạo (WEBHOOK_TOKENS để trống) — giữ qua các lần deploy lại
      - data:/app/data
    ports:
      # chỉ mở trên máy chủ; ra Internet (để server Zenify gọi tới) thì đặt sau reverse proxy HTTPS
      - "127.0.0.1:${SERVER_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  data:
